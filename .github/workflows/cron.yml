name: Poll YesWeHack

on:
  schedule:
    # Off-peak minutes: runs scheduled at :00/:30 are the most throttled on
    # GitHub's shared runners, which stretched our 30-min cadence to hours.
    - cron: "7,37 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger poll
        run: curl -fsS -m 290 -X POST "https://huntert.vercel.app/api/poll"
